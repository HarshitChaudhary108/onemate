[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outmate-backend"
version = "0.1.0"
description = "Outmate prototype backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite==0.22.1",
    "Authlib==1.9.1",
    "cryptography==50.0.2",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "sse-starlette==3.5.0",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.16.10",
    "mypy==2.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "authlib.*"
ignore_missing_imports = true
